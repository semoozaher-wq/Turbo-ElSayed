name: Python package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

          FONT_DIR="resource/fonts"
          mkdir -p "$FONT_DIR"

          FONT_FILE=$(find /usr/share/fonts -type f -name "NotoSansCJK-Regular.ttc" | head -n 1)

          if [ -z "$FONT_FILE" ]; then
            echo "Noto CJK font was not found"
            exit 1
          fi

          cp "$FONT_FILE" "$FONT_DIR/STHeitiMedium.ttc"
          cp "$FONT_FILE" "$FONT_DIR/STHeitiLight.ttc"

          ls -lh "$FONT_DIR"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install flake8 pytest

      - name: Check Python syntax
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Run tests
        run: |
          python -m pytest
