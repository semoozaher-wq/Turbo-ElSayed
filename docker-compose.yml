services:
  redis:
    image: redis:7.4-alpine
    container_name: moneyprinterturbo-redis
    restart: unless-stopped
    init: true
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--maxmemory-policy", "noeviction"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    expose:
      - "6379"
    volumes:
      - mpt_redis:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD_MIRROR: ${DOCKER_BUILD_MIRROR:-official}
        PIP_USE_OFFICIAL: ${PIP_USE_OFFICIAL:-1}
    container_name: moneyprinterturbo-webui
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      MPT_ENVIRONMENT: production
      MPT_API_KEY: ${MPT_API_KEY:?Set MPT_API_KEY in .env or the shell environment}
      MPT_APP_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config.toml:/MoneyPrinterTurbo/config.toml:ro
      - mpt_storage:/MoneyPrinterTurbo/storage
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /MoneyPrinterTurbo/tmp:size=512m,uid=10001,gid=10001,mode=700
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD_MIRROR: ${DOCKER_BUILD_MIRROR:-official}
        PIP_USE_OFFICIAL: ${PIP_USE_OFFICIAL:-1}
    container_name: moneyprinterturbo-api
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    ports:
      - "127.0.0.1:8080:8080"
    command: ["python3", "main.py"]
    environment:
      MPT_ENVIRONMENT: production
      MPT_API_KEY: ${MPT_API_KEY:?Set MPT_API_KEY in .env or the shell environment}
      MPT_APP_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config.toml:/MoneyPrinterTurbo/config.toml:ro
      - mpt_storage:/MoneyPrinterTurbo/storage
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /MoneyPrinterTurbo/tmp:size=512m,uid=10001,gid=10001,mode=700
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mpt_storage:
    name: moneyprinterturbo-storage
  mpt_redis:
    name: moneyprinterturbo-redis
