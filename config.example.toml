# Turbo ElSayed - standalone configuration template
# Copy this file to config.toml and fill in private credentials locally.
# Never commit real API keys to the repository.

# Application server
log_level = "INFO"
listen_host = "0.0.0.0"
listen_port = 8501
reload_debug = false
project_name = "Turbo ElSayed"
project_version = "1.0.0"
project_description = "Standalone Arabic movie and scenario generator"

[app]
name = "Turbo ElSayed"
language = "ar"
output_dir = "output"
movie_mode = true
api_key = ""

[scenario]
provider = "gemini"
language = "ar"
model = "gemini-2.5-flash"
base_url = ""
api_key = ""
temperature = 0.7
scene_count = 8
scene_duration = 5
output_dir = "output/scenarios"
characters_file = "characters.json"

[llm]
provider = "gemini"
api_key = ""
base_url = ""
model = "gemini-2.5-flash"

[character_manager]
characters_file = "characters.json"
character_strength = 0.8

[video_generation]
image_provider = "none"
image_api_key = ""
character_reference_url = ""
video_provider = "none"
video_api_key = ""
scene_duration = 5
aspect_ratio = "16:9"
resolution = "1080p"

[subtitle]
provider = "none"
model_size = "large-v3-turbo"
language = "ar"

[voice]
provider = "none"
api_key = ""
region = ""
voice_id = ""

[proxy]
enabled = false
http = ""
https = ""
verify_tls = true

[ui]
language = "ar"
hide_config = false
show_logs = true
hide_log = false

[storage]
output_dir = "output"
scenarios_dir = "output/scenarios"
logs_dir = "output/logs"
temporary_dir = "output/tmp"

# Environment-variable alternatives:
# OPENAI_API_KEY=your_key_here
# OPENAI_BASE_URL=https://api.openai.com/v1
# SCENARIO_MODEL=gpt-4o-mini
# SCENARIO_OUTPUT_DIR=output/scenarios
# CHARACTERS_FILE=characters.json
